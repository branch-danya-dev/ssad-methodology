.line{stroke:#4b5563;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
.dash{stroke:#9ca3af;stroke-width:1.4;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}
</style>

