<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
<title id="title">SSAD — Dependency-Driven Analysis Workflow</title>
<desc id="desc">SSAD — Dependency-Driven Analysis Workflow</desc>
<defs>
