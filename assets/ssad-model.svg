<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">SSAD — Three Connected Models</title>
<desc id="desc">SSAD — Three Connected Models</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
</marker>

<style>
.title{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
.head{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}
.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563}
.box{fill:#ffffff;stroke:#9ca3af;stroke-width:1.5}
.root{fill:#f3f4f6;stroke:#374151;stroke-width:1.8}
.accent{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8}
.line{stroke:#4b5563;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
.dash{stroke:#9ca3af;stroke-width:1.4;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}
</style>

</defs>
<rect x="350" y="35" rx="18" width="500" height="105" class="root"/>
<text x="600" y="73" text-anchor="middle" class="title">
<tspan x="600" dy="0">SSAD</tspan>
</text>
<text x="600" y="108" text-anchor="middle" class="body">
<tspan x="600" dy="0">A system-oriented knowledge lifecycle</tspan>
</text>
<rect x="55" y="225" rx="18" width="350" height="235" class="box"/>
<text x="230" y="265" text-anchor="middle" class="head">
<tspan x="230" dy="0">Knowledge Architecture</tspan>
</text>
<text x="230" y="298" text-anchor="middle" class="small">
<tspan x="230" dy="0">WHERE knowledge belongs</tspan>
</text>
<text x="230" y="340" text-anchor="middle" class="body">
<tspan x="230" dy="0">• analytical perspectives</tspan>
<tspan x="230" dy="26">• canonical ownership</tspan>
<tspan x="230" dy="26">• references and relations</tspan>
<tspan x="230" dy="26">• system synthesis</tspan>
</text>
<path d="M600 140 C600 180 230 180 230 225" class="line"/>
<rect x="425" y="225" rx="18" width="350" height="235" class="accent"/>
<text x="600" y="265" text-anchor="middle" class="head">
<tspan x="600" dy="0">Analysis Workflow</tspan>
</text>
<text x="600" y="298" text-anchor="middle" class="small">
<tspan x="600" dy="0">HOW knowledge is built</tspan>
</text>
<text x="600" y="340" text-anchor="middle" class="body">
<tspan x="600" dy="0">• evidence</tspan>
<tspan x="600" dy="26">• boundaries</tspan>
<tspan x="600" dy="26">• ownership</tspan>
<tspan x="600" dy="26">• maturity and verification</tspan>
</text>
<path d="M600 140 C600 180 600 180 600 225" class="line"/>
<rect x="795" y="225" rx="18" width="350" height="235" class="box"/>
<text x="970" y="265" text-anchor="middle" class="head">
<tspan x="970" dy="0">Change Model</tspan>
</text>
<text x="970" y="298" text-anchor="middle" class="small">
<tspan x="970" dy="0">HOW knowledge evolves</tspan>
</text>
<text x="970" y="340" text-anchor="middle" class="body">
<tspan x="970" dy="0">• Change Surface</tspan>
<tspan x="970" dy="26">• impact analysis</tspan>
<tspan x="970" dy="26">• traceability</tspan>
<tspan x="970" dy="26">• maintenance</tspan>
</text>
<path d="M600 140 C600 180 970 180 970 225" class="line"/>
</svg>